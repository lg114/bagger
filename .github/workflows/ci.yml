name: CI

"on":
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Python lint + test (unchanged)
  # ──────────────────────────────────────────────
  lint-and-test:
    name: Lint + Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"
          pip install httpx

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Test with pytest
        run: pytest tests/ -q --cov=bagger --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  # ──────────────────────────────────────────────
  # Job 2: Frontend tests + Vite build (Ubuntu)
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: TypeScript and Vite build
        run: npm run build

  # ──────────────────────────────────────────────
  # Job 3: Tauri Windows MSI build
  #   Runs only on: push to main, release tags,
  #   or manual trigger — not on every PR.
  # ──────────────────────────────────────────────
  tauri:
    name: Tauri Windows Build
    runs-on: windows-latest
    needs: [lint-and-test, frontend]
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      - name: Install backend build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,bundle]"

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build Python sidecar
        run: python scripts/build-backend.py

      - name: Build Tauri installer
        working-directory: ui
        run: npm run tauri build

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: bagger-windows-msi
          path: ui/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  # ──────────────────────────────────────────────
  # Job 4: Publish a version tag as a GitHub Release
  #   Release builds are deliberately tag-only; pull requests and ordinary
  #   main-branch pushes receive CI/artifacts without publishing a release.
  # ──────────────────────────────────────────────
  release:
    name: Publish Windows Release
    runs-on: ubuntu-latest
    needs: tauri
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download MSI artifact
        uses: actions/download-artifact@v4
        with:
          name: bagger-windows-msi
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*.msi
